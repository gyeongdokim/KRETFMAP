name: daily-market-data

on:
  schedule:
    - cron: "0 1 * * 1-5"   # 한국시간 평일 10:00
  workflow_dispatch:
    inputs:
      backfill:
        description: "과거 N거래일 채우기 (최초 1회만, 예: 60)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build market.json
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/build_market.py --backfill "${{ github.event.inputs.backfill || 0 }}"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
